<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="theme-color" content="#0b6e78">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="{{ app_name }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
</head>
<body{% if current_user.is_authenticated %} data-auth="1" data-poll-active="{{ config.POLL_INTERVAL_ACTIVE_MS }}" data-poll-idle="{{ config.POLL_INTERVAL_IDLE_MS }}" data-poll-chat-max="{{ config.POLL_INTERVAL_CHAT_MAX_MS }}" data-poll-list="{{ config.POLL_INTERVAL_LIST_MS }}"{% endif %}>
  {% include "partials/icons.html" %}
  <div class="app">
    {% if site_banner %}<div class="site-banner" role="status">{{ site_banner }}</div>{% endif %}
  {% block app %}{% endblock %}
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
  {% if current_user.is_authenticated %}<script src="{{ url_for('static', filename='js/badge.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/push.js') }}" defer></script>{% endif %}
  {% block scripts %}{% endblock %}
</body>
</html>
