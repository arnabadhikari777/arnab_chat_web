<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="theme-color" content="#0b6e78">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
</head>
<body{% if current_user.is_authenticated %} data-auth="1" data-poll-active="{{ config.POLL_INTERVAL_ACTIVE_MS }}" data-poll-idle="{{ config.POLL_INTERVAL_IDLE_MS }}"{% endif %}>
  {% include "partials/icons.html" %}
  <div class="app">
    {% block app %}{% endblock %}
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
  {% if current_user.is_authenticated %}<script src="{{ url_for('static', filename='js/badge.js') }}" defer></script>{% endif %}
  {% block scripts %}{% endblock %}
</body>
</html>
