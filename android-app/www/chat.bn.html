<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  
  <meta name="theme-color" content="#0b6e78">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Goppo">
  
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
  <title> - Goppo</title>
  
  
  <link rel="stylesheet" href="/static/fonts/fonts.css">
  <script src="/static/js/bundle-boot.js"></script>
  
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
</head>
<body data-auth="1" data-poll-active="2500" data-poll-idle="12000" data-poll-chat-max="5000" data-poll-list="5000">
  <svg class="hidden" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></symbol>
  <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.8a3.5 3.5 0 0 1 0 6.4"/><path d="M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 6 2 7.5 2 7.5H4S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3l-7 18-4-7-7-4 18-7z"/><path d="M21 3L10 14"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><path d="M20 11.5l-8 8a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7L9.5 17.2a1.7 1.7 0 0 1-2.4-2.4L14.5 7.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-check2" viewBox="0 0 24 24"><path d="M2 12.5L6.5 17 15 8.5"/><path d="M10 15.5l1.5 1.5L21 7.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
  <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9.5v.5M15 9.5v.5"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><path d="M12 6v.01M12 12v.01M12 18v.01"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-8 8"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></symbol>
</svg>
  <div class="app">
    
  
<div class="chat-screen" id="chat"
     data-conversation="0"
     data-peer="0"
     data-max-chars="4000" data-max-voice="300"
     data-max-image="5242880" data-max-video="26214400" data-max-document="10485760"
     data-max-file="10485760" data-max-voice-bytes="5242880">
  <header class="topbar">
    <a class="icon-btn" href="/messages.html" aria-label="ফিরে যান"><svg class="icon"><use href="#i-back"/></svg></a>
    <a class="chat-head" href="https://arnabchatweb.pythonanywhere.com/u/user">
      
  <span class="avatar avatar--a avatar--sm">
    
  </span>

      <span class="chat-head__text"><strong></strong><span class="muted" id="peer-status">&nbsp;</span></span>
    </a>
  </header>

  <div class="chat-scroll chat-bg" id="chat-scroll">
    <button class="btn btn--ghost hidden" id="load-older" type="button">আগের মেসেজ দেখুন</button>
    <div id="chat-messages" class="chat-messages" aria-live="polite"></div>
    <div id="chat-empty" class="empty hidden"><p class="muted">এখনো কোনো মেসেজ নেই। হ্যালো বলুন!</p></div>
  </div>
  <div class="banner banner--error hidden" id="chat-offline">ইন্টারনেট সংযোগ নেই। আবার চেষ্টা করুন।</div>

  <div id="emoji-panel" class="emoji-panel hidden" role="group" aria-label="ইমোজি"></div>

  <form class="composer" id="composer" autocomplete="off">
    <div class="composer__row" id="composer-default">
      <button class="icon-btn" type="button" id="btn-attach" aria-label="সংযুক্ত করুন"><svg class="icon"><use href="#i-clip"/></svg></button>
      <button class="icon-btn" type="button" id="btn-emoji" aria-label="ইমোজি"><svg class="icon"><use href="#i-smile"/></svg></button>
      <textarea class="input" id="msg-input" rows="1" maxlength="4000" placeholder="মেসেজ লিখুন" aria-label="মেসেজ লিখুন"></textarea>
      <button class="icon-btn icon-btn--primary hidden" type="submit" id="btn-send" aria-label="পাঠান"><svg class="icon"><use href="#i-send"/></svg></button>
      <button class="icon-btn icon-btn--primary" type="button" id="btn-mic" aria-label="ভয়েস মেসেজ রেকর্ড করুন"><svg class="icon"><use href="#i-mic"/></svg></button>
    </div>

    <div class="composer__row hidden" id="composer-voice">
      <button class="icon-btn" type="button" id="vr-delete" aria-label="রেকর্ডিং মুছুন"><svg class="icon"><use href="#i-trash"/></svg></button>
      <div class="vr-body" id="vr-recording">
        <span class="vr-dot" id="vr-dot"></span><span class="vr-time" id="vr-time">0:00</span>
        <span class="muted" id="vr-state">রেকর্ড হচ্ছে...</span>
      </div>
      <div class="vr-body hidden" id="vr-preview">
        <button class="icon-btn" type="button" id="vr-play" aria-label="চালান"><svg class="icon"><use href="#i-play"/></svg></button>
        <input class="vr-seek" type="range" id="vr-seek" min="0" max="100" value="0" aria-label="অডিওর অবস্থান">
        <span class="vr-time" id="vr-preview-time">0:00</span>
      </div>
      <button class="icon-btn" type="button" id="vr-pause" aria-label="থামান"><svg class="icon"><use href="#i-pause"/></svg></button>
      <button class="icon-btn" type="button" id="vr-stop" aria-label="শেষ করুন"><svg class="icon"><use href="#i-stop"/></svg></button>
      <button class="icon-btn icon-btn--primary hidden" type="button" id="vr-send" aria-label="ভয়েস মেসেজ পাঠান"><svg class="icon"><use href="#i-send"/></svg></button>
    </div>
  </form>

  <input class="sr-only" type="file" id="file-media" accept="image/*,video/*" tabindex="-1">
  <input class="sr-only" type="file" id="file-doc" tabindex="-1">
  <div id="attach-menu" class="attach-menu hidden">
    <button class="btn btn--secondary" type="button" data-attach="media"><svg class="icon"><use href="#i-photo"/></svg>ছবি বা ভিডিও</button>
    <button class="btn btn--secondary" type="button" data-attach="doc"><svg class="icon"><use href="#i-file"/></svg>ডকুমেন্ট বা ফাইল</button>
  </div>
</div>

  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/static/js/platform.js" defer></script>
  <script src="/static/js/app.js" defer></script>
  <script src="/static/js/local-first.js" defer></script>
  <script src="/static/js/badge.js" defer></script>
  <script src="/static/js/push.js" defer></script>
  <script src="/static/js/calling.js" defer></script>
  <script src="/static/js/device.js" defer></script>
  
<script src="/static/js/voice.js" defer></script>
<script src="/static/js/chat.js" defer></script>

</body>
</html>
