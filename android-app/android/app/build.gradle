apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Firebase: the Android client config (google-services.json) is injected at build time from a GitHub secret and is never
// committed. Without it the app still builds; native push is simply reported as unavailable (nativePush = false).
def hasFirebaseConfig = file('google-services.json').exists()
if (hasFirebaseConfig) {
    apply plugin: 'com.google.gms.google-services'
}

// Version comes from the CI run number (-PgoppoVersionCode / -PgoppoVersionName); local builds default to 1 / 1.0.0.
def goppoVersionCode = Integer.valueOf((project.findProperty('goppoVersionCode') ?: '1').toString())
def goppoVersionName = (project.findProperty('goppoVersionName') ?: '1.0.0').toString()

// Release signing comes ONLY from environment variables (GitHub Actions secrets). Nothing is stored in the repository.
def releaseKeystorePath = System.getenv('GOPPO_KEYSTORE_FILE')
def hasReleaseSigning = releaseKeystorePath != null && file(releaseKeystorePath).exists() &&
        System.getenv('GOPPO_KEYSTORE_PASSWORD') && System.getenv('GOPPO_KEY_ALIAS') && System.getenv('GOPPO_KEY_PASSWORD')

android {
    namespace "com.goppo.chat"     // Kotlin/R package. Independent of applicationId, so the id can change before release.
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        // Provisional application id: change it here (one line) before a public release.
        applicationId "com.goppo.chat"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode goppoVersionCode
        versionName goppoVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv('GOPPO_KEYSTORE_PASSWORD')
                keyAlias System.getenv('GOPPO_KEY_ALIAS')
                keyPassword System.getenv('GOPPO_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }

    lint {
        abortOnError false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.work:work-runtime:2.9.1"           // Task 2: persistent background sync / media download jobs
    implementation platform("com.google.firebase:firebase-bom:$firebaseBomVersion")
    implementation "com.google.firebase:firebase-messaging"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'
