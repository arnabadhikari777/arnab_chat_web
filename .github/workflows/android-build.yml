name: Android build

# Builds the Goppo Chat Android app (Capacitor 7 + Kotlin) and uploads the APK(s) as workflow artifacts.
#  - Debug APK: always, no secrets needed.
#  - Release APK: only when all four signing secrets exist (see docs/ANDROID_BUILD.md). Nothing is published to Google Play.
#  - Firebase (Phase 3): if the GOOGLE_SERVICES_JSON_BASE64 secret exists it is decoded into android-app/android/app/google-services.json
#    (git-ignored) so the app can use Firebase Cloud Messaging. Without it the app still builds; native push is then reported unavailable.
#    That file is the Android CLIENT config (not the server's service-account key, which never goes to GitHub or into the APK).

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: "Also build a signed Release APK (needs the signing secrets)"
        type: boolean
        default: false
  push:
    branches: [main, master]
    paths:
      - "android-app/**"
      - ".github/workflows/android-build.yml"
      - "chat-web/app/static/js/platform.js"
  pull_request:
    paths:
      - "android-app/**"

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android-app
    env:
      # Secrets are exposed only as environment variables and never echoed. Empty when not configured.
      HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
      HAS_SIGNING: ${{ secrets.GOPPO_KEYSTORE_BASE64 != '' && secrets.GOPPO_KEYSTORE_PASSWORD != '' && secrets.GOPPO_KEY_ALIAS != '' && secrets.GOPPO_KEY_PASSWORD != '' }}
      GOPPO_VERSION_CODE: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: gradle/actions/setup-gradle@v5

      - name: Add Firebase client config (secret)
        if: ${{ env.HAS_FIREBASE == 'true' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -e
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          # fail early, without printing the file, if it is not a Firebase client config for this app id
          python3 - <<'PY'
          import json
          d = json.load(open("android/app/google-services.json"))
          ids = [c["client_info"]["android_client_info"]["package_name"] for c in d.get("client", [])]
          assert "com.goppo.chat" in ids, "google-services.json has no client for com.goppo.chat"
          assert "private_key" not in json.dumps(d), "this looks like a service-account key; use the Android google-services.json"
          print("google-services.json OK for com.goppo.chat")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: chat-web/requirements.txt

      - name: Install pinned Node dependencies
        run: npm ci --no-audit --no-fund

      # Task 2: the APK contains the website's own frontend. Build it from the real templates/CSS/JS before every sync, so a
      # frontend change is in the next APK automatically. GOPPO_BACKEND_URL is a public address (not a secret); default = production.
      - name: Build the bundled frontend from the website sources
        working-directory: .
        env:
          GOPPO_BACKEND_URL: ${{ vars.GOPPO_BACKEND_URL }}
        run: |
          pip install -r chat-web/requirements.txt
          if [ -z "$GOPPO_BACKEND_URL" ]; then unset GOPPO_BACKEND_URL; fi
          python chat-web/tools/build_android_web.py

      - name: Sync Capacitor and rebuild the bridge script
        run: |
          npx cap sync android
          npm run prepare:bridge

      - name: Static checks (config, security, JS bridge)
        run: npm test

      - name: Make the Gradle wrapper executable (a ZIP upload can drop the permission bit)
        run: chmod +x android/gradlew

      - name: Kotlin unit tests
        working-directory: android-app/android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build Debug APK
        working-directory: android-app/android
        run: ./gradlew --no-daemon assembleDebug -PgoppoVersionCode=${GOPPO_VERSION_CODE} -PgoppoVersionName=1.0.${GOPPO_VERSION_CODE}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: goppo-chat-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Decode release keystore
        id: keystore
        if: ${{ env.HAS_SIGNING == 'true' && (github.event_name == 'push' || inputs.build_release) }}
        env:
          KEYSTORE_B64: ${{ secrets.GOPPO_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/goppo-release.jks"
          echo "path=$RUNNER_TEMP/goppo-release.jks" >> "$GITHUB_OUTPUT"

      - name: Build signed Release APK
        if: ${{ steps.keystore.outcome == 'success' }}
        working-directory: android-app/android
        env:
          GOPPO_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          GOPPO_KEYSTORE_PASSWORD: ${{ secrets.GOPPO_KEYSTORE_PASSWORD }}
          GOPPO_KEY_ALIAS: ${{ secrets.GOPPO_KEY_ALIAS }}
          GOPPO_KEY_PASSWORD: ${{ secrets.GOPPO_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PgoppoVersionCode=${GOPPO_VERSION_CODE} -PgoppoVersionName=1.0.${GOPPO_VERSION_CODE}

      - name: Upload Release APK
        if: ${{ steps.keystore.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: goppo-chat-release-apk
          path: android-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore
        if: ${{ always() && steps.keystore.outputs.path != '' }}
        run: rm -f "${{ steps.keystore.outputs.path }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Goppo Chat Android build"
            echo "- Debug APK artifact: goppo-chat-debug-apk"
            if [ "$HAS_FIREBASE" = "true" ]; then echo "- Firebase: google-services.json injected (native push available)"; else echo "- Firebase: secret GOOGLE_SERVICES_JSON_BASE64 not set, so this APK has no native push"; fi
            if [ "${{ steps.keystore.outcome }}" = "success" ]; then echo "- Release APK artifact: goppo-chat-release-apk (signed)"; else echo "- Release APK: skipped (signing secrets not set, or not requested)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
